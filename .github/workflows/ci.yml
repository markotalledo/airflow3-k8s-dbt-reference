name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm repo add apache-airflow https://airflow.apache.org
      - name: render the chart with our values
        run: helm template airflow apache-airflow/airflow -n airflow -f k8s/values.yaml > /dev/null
