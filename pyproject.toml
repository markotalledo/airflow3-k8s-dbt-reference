[project]
name = "airflow3-k8s-dbt-reference"
version = "0.1.0"
description = "Airflow 3 on Kubernetes running a PySpark job and dbt in their own pods, with warehouse pools, retries, Slack alerts and safe backfills."
requires-python = ">=3.12,<3.13"
dependencies = [
    "apache-airflow>=3.0,<4",
    "apache-airflow-providers-cncf-kubernetes>=10",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["dags"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
